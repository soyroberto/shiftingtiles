name: Deploy beta gallery to Azure Storage

# Production workflows are deliberately unchanged.
"on":
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiftingtiles-beta-storage
  cancel-in-progress: false

env:
  BETA_STORAGE_ACCOUNT: saauxfotos
  AZURE_STORAGE_AUTH_MODE: login
  AZURE_CORE_OUTPUT: none

jobs:
  deploy:
    # Guard manual runs and prevent this workflow deploying after a merge to master.
    if: github.ref == 'refs/heads/beta' && github.repository == 'soyroberto/shiftingtiles'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: beta
      url: ${{ vars.BETA_WEBSITE_URL }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the triggering beta commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate beta configuration
        env:
          BETA_AZURE_CLIENT_ID: ${{ secrets.BETA_AZURE_CLIENT_ID }}
          BETA_AZURE_TENANT_ID: ${{ secrets.BETA_AZURE_TENANT_ID }}
          BETA_AZURE_SUBSCRIPTION_ID: ${{ secrets.BETA_AZURE_SUBSCRIPTION_ID }}
          BETA_WEBSITE_URL: ${{ vars.BETA_WEBSITE_URL }}
        run: |
          set -euo pipefail
          for setting in BETA_AZURE_CLIENT_ID BETA_AZURE_TENANT_ID BETA_AZURE_SUBSCRIPTION_ID BETA_WEBSITE_URL; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing beta environment setting: $setting. See docs/beta-storage-setup.md."
              exit 1
            fi
          done
          if [[ ! "$BETA_WEBSITE_URL" =~ ^https://saauxfotos(\.z[0-9]+)?\.web\.core\.windows\.net/?$ ]]; then
            echo "::error::BETA_WEBSITE_URL must be the HTTPS static website endpoint for saauxfotos."
            exit 1
          fi
          command -v az >/dev/null
          command -v python3 >/dev/null

      - name: Package only public website assets
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_static_site.py \
            --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/shiftingtiles-beta-site"

      - name: Authenticate to Azure using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.BETA_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BETA_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BETA_AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Upload assets without deleting existing blobs
        run: |
          set -euo pipefail
          az storage blob upload-batch \
            --account-name "$BETA_STORAGE_ACCOUNT" \
            --auth-mode login \
            --destination '$web' \
            --source "$RUNNER_TEMP/shiftingtiles-beta-site/assets" \
            --overwrite true \
            --content-cache-control 'public, max-age=300' \
            --only-show-errors \
            --output none

      - name: Publish index after its assets
        run: |
          set -euo pipefail
          az storage blob upload \
            --account-name "$BETA_STORAGE_ACCOUNT" \
            --auth-mode login \
            --container-name '$web' \
            --name index.html \
            --file "$RUNNER_TEMP/shiftingtiles-beta-site/entrypoint/index.html" \
            --overwrite true \
            --content-type 'text/html; charset=utf-8' \
            --content-cache-control 'no-cache' \
            --only-show-errors \
            --output none

      - name: Verify the public beta endpoint
        env:
          BETA_WEBSITE_URL: ${{ vars.BETA_WEBSITE_URL }}
        run: |
          set -euo pipefail
          base_url="${BETA_WEBSITE_URL%/}"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            "$base_url/index.html?deployment=$GITHUB_SHA" \
            --output "$RUNNER_TEMP/shiftingtiles-beta-index.html"
          if ! cmp --silent "$RUNNER_TEMP/shiftingtiles-beta-site/entrypoint/index.html" "$RUNNER_TEMP/shiftingtiles-beta-index.html"; then
            echo "::error::The beta endpoint did not return the deployed index.html."
            exit 1
          fi
          for asset in jquery-1.8.3.js less-2.5.1.min.js album-queue.js shiftingtiles.js gallery-source.js gallery-layout.js gallery-player.js shiftingtiles.less f1.jpeg; do
            curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 15 --max-time 60 \
              "$base_url/$asset?deployment=$GITHUB_SHA" --output /dev/null
          done
          {
            echo '## Beta gallery deployment'
            echo "Website: $base_url"
            echo 'Storage account: saauxfotos'
            echo "Commit: $GITHUB_SHA"
            echo 'Only packaged website files were uploaded; no blobs were deleted.'
          } >> "$GITHUB_STEP_SUMMARY"
